name: Update Latest News

# Refreshes the self-contained LATEST_NEWS block in index.html from official
# Microsoft RSS feeds. The page never fetches at runtime — this bakes the data
# in and commits it, so GitHub Pages redeploys automatically with no manual work.

on:
  schedule:
    # Daily at 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-latest-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Latest News
        run: python update_latest_news.py

      - name: Commit changes
        run: |
          if [[ -z "$(git status --porcelain index.html)" ]]; then
            echo "No changes to index.html — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: refresh Latest News from Microsoft RSS feeds"
          git push
